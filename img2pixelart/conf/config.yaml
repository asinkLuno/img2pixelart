# 全局 settings —— 由 hydra-core 加载
defaults:
  - _self_
  - perceive: default
  - structure: default
  - render: default
  - ui: default
  - ascii: default

img: ???
width: 64
height: 64
alpha_threshold: 128
palette: null

hydra:
  job:
    chdir: true
  run:
    dir: outputs/single/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra:job.override_dirname}
  callbacks:
    auto_stitch:
      _target_: img2pixelart.cli._StitchCallback
