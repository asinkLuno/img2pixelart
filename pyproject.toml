[project]
name = "img2pixelart"
version = "0.1.2"
description = "Convert photos to pixel art with palette fitting and multi-style dithering"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "guozr", email = "guozr1997@hotmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "hydra-core>=1.3.5",
    "hydra-joblib-launcher>=1.2.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pyqt6>=6.11.0",
]

[project.urls]
Repository = "https://github.com/asinkLuno/img2pixelart"

[project.scripts]
img2pixelart = "img2pixelart.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.build-backend]
module-name = "img2pixelart"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
    "vulture>=2.16",
]
