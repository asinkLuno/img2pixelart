[project]
name = "img2pixelart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guozr", email = "guozr1997@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.5",
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
img2pixelart = "img2pixelart.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.build-backend]
module-name = "img2pixelart"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.69",
]
